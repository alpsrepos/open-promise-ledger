name: fix layout (one-off)
on:
  push:
    paths:
      - ".github/workflows/fix-layout.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into their folders
        run: |
          set -e
          if [ -f "AUDITOR-INSTRUCTIONS.md" ]; then mkdir -p "$(dirname "auditor/AUDITOR-INSTRUCTIONS.md")"; git mv -f "AUDITOR-INSTRUCTIONS.md" "auditor/AUDITOR-INSTRUCTIONS.md"; fi
          if [ -f "audit-sheet.csv" ]; then mkdir -p "$(dirname "auditor/audit-sheet.csv")"; git mv -f "audit-sheet.csv" "auditor/audit-sheet.csv"; fi
          if [ -f "CODER-INSTRUCTIONS.md" ]; then mkdir -p "$(dirname "coder/CODER-INSTRUCTIONS.md")"; git mv -f "CODER-INSTRUCTIONS.md" "coder/CODER-INSTRUCTIONS.md"; fi
          if [ -f "entry-evidence.csv" ]; then mkdir -p "$(dirname "coder/entry-evidence.csv")"; git mv -f "entry-evidence.csv" "coder/entry-evidence.csv"; fi
          if [ -f "entry-instruments.csv" ]; then mkdir -p "$(dirname "coder/entry-instruments.csv")"; git mv -f "entry-instruments.csv" "coder/entry-instruments.csv"; fi
          if [ -f "entry-links.csv" ]; then mkdir -p "$(dirname "coder/entry-links.csv")"; git mv -f "entry-links.csv" "coder/entry-links.csv"; fi
          if [ -f "entry-observations.csv" ]; then mkdir -p "$(dirname "coder/entry-observations.csv")"; git mv -f "entry-observations.csv" "coder/entry-observations.csv"; fi
          if [ -f "entry-promises.csv" ]; then mkdir -p "$(dirname "coder/entry-promises.csv")"; git mv -f "entry-promises.csv" "coder/entry-promises.csv"; fi
          if [ -f "questions.csv" ]; then mkdir -p "$(dirname "coder/questions.csv")"; git mv -f "questions.csv" "coder/questions.csv"; fi
          if [ -f "data-dictionary.md" ]; then mkdir -p "$(dirname "dictionary/data-dictionary.md")"; git mv -f "data-dictionary.md" "dictionary/data-dictionary.md"; fi
          if [ -f "schema.json" ]; then mkdir -p "$(dirname "dictionary/schema.json")"; git mv -f "schema.json" "dictionary/schema.json"; fi
          if [ -f "index.html" ]; then mkdir -p "$(dirname "docs/index.html")"; git mv -f "index.html" "docs/index.html"; fi
          if [ -f "who.html" ]; then mkdir -p "$(dirname "docs/who.html")"; git mv -f "who.html" "docs/who.html"; fi
          if [ -f "PROTOCOL-REGISTRATION.md" ]; then mkdir -p "$(dirname "protocol/PROTOCOL-REGISTRATION.md")"; git mv -f "PROTOCOL-REGISTRATION.md" "protocol/PROTOCOL-REGISTRATION.md"; fi
          if [ -f "ai-settings.md" ]; then mkdir -p "$(dirname "protocol/ai-settings.md")"; git mv -f "ai-settings.md" "protocol/ai-settings.md"; fi
          if [ -f "check-panel.csv" ]; then mkdir -p "$(dirname "protocol/check-panel.csv")"; git mv -f "check-panel.csv" "protocol/check-panel.csv"; fi
          if [ -f "dev-runs.md" ]; then mkdir -p "$(dirname "protocol/dev-runs.md")"; git mv -f "dev-runs.md" "protocol/dev-runs.md"; fi
          if [ -f "deviations.md" ]; then mkdir -p "$(dirname "protocol/deviations.md")"; git mv -f "deviations.md" "protocol/deviations.md"; fi
          if [ -f "editor-checks.csv" ]; then mkdir -p "$(dirname "protocol/editor-checks.csv")"; git mv -f "editor-checks.csv" "protocol/editor-checks.csv"; fi
          if [ -f "extraction-prompt.md" ]; then mkdir -p "$(dirname "protocol/extraction-prompt.md")"; git mv -f "extraction-prompt.md" "protocol/extraction-prompt.md"; fi
          if [ -f "terms-checks.csv" ]; then mkdir -p "$(dirname "protocol/terms-checks.csv")"; git mv -f "terms-checks.csv" "protocol/terms-checks.csv"; fi
          if [ -f "audit_sheet.py" ]; then mkdir -p "$(dirname "scripts/audit_sheet.py")"; git mv -f "audit_sheet.py" "scripts/audit_sheet.py"; fi
          if [ -f "build_pack.py" ]; then mkdir -p "$(dirname "scripts/build_pack.py")"; git mv -f "build_pack.py" "scripts/build_pack.py"; fi
          if [ -f "checks.py" ]; then mkdir -p "$(dirname "scripts/checks.py")"; git mv -f "checks.py" "scripts/checks.py"; fi
          if [ -f "freeze.py" ]; then mkdir -p "$(dirname "scripts/freeze.py")"; git mv -f "freeze.py" "scripts/freeze.py"; fi
          if [ -f "notice.py" ]; then mkdir -p "$(dirname "scripts/notice.py")"; git mv -f "notice.py" "scripts/notice.py"; fi
          if [ -f "panel.py" ]; then mkdir -p "$(dirname "scripts/panel.py")"; git mv -f "panel.py" "scripts/panel.py"; fi
          if [ -f "quote_check.py" ]; then mkdir -p "$(dirname "scripts/quote_check.py")"; git mv -f "quote_check.py" "scripts/quote_check.py"; fi
          if [ -f "readings.py" ]; then mkdir -p "$(dirname "scripts/readings.py")"; git mv -f "readings.py" "scripts/readings.py"; fi
          if [ -f "stats.py" ]; then mkdir -p "$(dirname "scripts/stats.py")"; git mv -f "stats.py" "scripts/stats.py"; fi
          if [ -f "test_checks.py" ]; then mkdir -p "$(dirname "tests/test_checks.py")"; git mv -f "test_checks.py" "tests/test_checks.py"; fi
          if [ -f "test_stats.py" ]; then mkdir -p "$(dirname "tests/test_stats.py")"; git mv -f "test_stats.py" "tests/test_stats.py"; fi
          if [ -f "REGISTRATION.md" ]; then mkdir -p "$(dirname "frame/REGISTRATION.md")"; git mv -f "REGISTRATION.md" "frame/REGISTRATION.md"; fi
          if [ -f checks.yml ]; then git rm -q checks.yml; fi
          echo "" | base64 -d > frame/REGISTRATION.md
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move update 2 files into their folders"
          git push
